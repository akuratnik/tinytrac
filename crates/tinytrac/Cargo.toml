[package]
name = "tinytrac"
description = "A tiny native time tracker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
directories.workspace = true
iced.workspace = true
jiff.workspace = true
thiserror.workspace = true
tinytrac-core.workspace = true
tinytrac-engine.workspace = true
# App-side OAuth and the retained Google Drive sync transport.
tinytrac-drive = { path = "../tinytrac-drive" }

[dev-dependencies]
iced_test.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { workspace = true, features = ["ksni"] }
zbus.workspace = true
# Persistent GNOME Secret Service via pure-Rust zbus, sharing the async-io runtime.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { workspace = true, features = ["default"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Store refresh tokens in the native macOS Keychain.
keyring-core = "1"
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
